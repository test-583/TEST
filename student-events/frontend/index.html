<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EventSphere — Student Events</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ── NAVBAR ─────────────────────────────────────── -->
  <nav>
    <div class="nav-logo">Event<span>Sphere</span></div>
    <div class="nav-links">
      <a href="#events">Events</a>
      <button class="btn-admin" onclick="toggleAdmin()">+ Add Event</button>
    </div>
  </nav>

  <!-- ── HERO ───────────────────────────────────────── -->
  <header class="hero">
    <div class="hero-tag">VTU · Bangalore · 2025</div>
    <h1>Discover &amp;<br/><span>Join Events</span></h1>
    <p>Workshops · Hackathons · Cultural Fests · Tech Talks</p>
    <div class="hero-scroll">↓ scroll to explore</div>
    <div class="hero-blob blob1"></div>
    <div class="hero-blob blob2"></div>
  </header>

  <!-- ── EVENTS SECTION ─────────────────────────────── -->
  <section id="events">
    <div class="section-header">
      <h2>Upcoming Events</h2>
      <span id="event-count" class="pill">Loading…</span>
    </div>
    <div id="events-grid" class="events-grid">
      <!-- cards injected by app.js -->
    </div>
    <div id="no-events" class="empty-state" style="display:none">
      No events yet. Be the first to add one!
    </div>
  </section>

  <!-- ── REGISTRATION MODAL ────────────────────────── -->
  <div id="reg-modal" class="modal-overlay" style="display:none">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <h3>Register for<br/><span id="reg-event-title">…</span></h3>
      <form id="reg-form">
        <input type="hidden" id="reg-event-id"/>
        <div class="form-row">
          <div class="field">
            <label>Full Name</label>
            <input id="f-name" type="text" placeholder="Rahul Kumar" required/>
          </div>
          <div class="field">
            <label>Roll Number</label>
            <input id="f-roll" type="text" placeholder="1BM22CS001" required/>
          </div>
        </div>
        <div class="field">
          <label>College Email</label>
          <input id="f-email" type="email" placeholder="rahul@college.edu" required/>
        </div>
        <div class="field">
          <label>Department</label>
          <select id="f-dept" required>
            <option value="">Select Department</option>
            <option>Computer Science (CS)</option>
            <option>Information Technology (IT)</option>
            <option>Electronics &amp; Communication (ECE)</option>
            <option>Mechanical Engineering (ME)</option>
            <option>Civil Engineering (CE)</option>
            <option>Electrical Engineering (EE)</option>
          </select>
        </div>
        <button type="submit" class="btn-submit">Register Now →</button>
        <p id="reg-msg" class="form-msg"></p>
      </form>
    </div>
  </div>

  <!-- ── ADMIN PANEL ───────────────────────────────── -->
  <div id="admin-panel" class="modal-overlay" style="display:none">
    <div class="modal">
      <button class="modal-close" onclick="toggleAdmin()">✕</button>
      <h3>Create New <span>Event</span></h3>
      <form id="event-form">
        <div class="field">
          <label>Event Title</label>
          <input id="e-title" type="text" placeholder="Hackathon 2025" required/>
        </div>
        <div class="field">
          <label>Description</label>
          <textarea id="e-desc" placeholder="Brief about the event…" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Venue</label>
            <input id="e-venue" type="text" placeholder="Seminar Hall A" required/>
          </div>
          <div class="field">
            <label>Max Seats</label>
            <input id="e-seats" type="number" placeholder="100" min="1"/>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Date</label>
            <input id="e-date" type="date" required/>
          </div>
          <div class="field">
            <label>Time</label>
            <input id="e-time" type="time" required/>
          </div>
        </div>
        <button type="submit" class="btn-submit">Publish Event →</button>
        <p id="event-msg" class="form-msg"></p>
      </form>
    </div>
  </div>

  <!-- ── FOOTER ────────────────────────────────────── -->
  <footer>
    <p>EventSphere · Built for VTU students, Bangalore 🎓</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
